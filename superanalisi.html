<!--
  superanalisi.html — dettaglio di un'asta (qualunque): dati della perizia
  (analisi v2, con pagina e citazione), valore di rivendita, conto
  dell'operazione (underwriting.js) e seconda opinione con altre AI, con il
  salvataggio del loro risultato (superanalisi-esterne.js).
  Si apre dal dettaglio dell'asta in index.html (pulsante "Superanalisi",
  per qualunque asta): superanalisi.html?id=<id annuncio>.
  Serve la password di scrittura (stesso sblocco di config.html e
  statistiche.html), usata anche per salvare il tuo valore di rivendita
  (sql/valore_rivendita.sql in aste-immobiliari).
-->

<style>
  :root {
    --bg: #eef1ec;
    --surface: #ffffff;
    --surface-2: #e3e7e0;
    --border: #d5dad1;
    --primary: #234c6a;
    --primary-soft: rgba(35, 76, 106, .10);
    --secondary: #a15c3e;
    --secondary-soft: rgba(161, 92, 62, .10);
    --ok: #3f6b4a;
    --ok-soft: rgba(63, 107, 74, .12);
    --danger: #8b3d2e;
    --danger-soft: rgba(139, 61, 46, .10);
    --ink: #1e2320;
    --ink-muted: #5b615a;
    --ink-faint: #696f67;   /* 01/10/2026: prima #8c9289, contrasto 2,8:1 sullo sfondo; ora 4,5:1 */
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--secondary); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 4px; }
  .nascosto { display: none !important; }

  .contenitore { max-width: 920px; margin: 0 auto; padding: 40px 20px 96px; }
  .intestazione { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;
    padding-bottom: 24px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .eyebrow { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); margin: 0 0 10px; }
  h1 { font-family: var(--font-display); font-size: 1.8rem; margin: 0 0 6px; }
  .sottotitolo { color: var(--ink-muted); font-size: .95rem; margin: 0; }
  .link-torna { font-size: .85rem; font-weight: 500; color: var(--ink-muted); text-decoration: none; white-space: nowrap; }
  .link-torna:hover { color: var(--primary); }
  .link-ritorno { display: flex; gap: 16px; flex-wrap: wrap; }

  .riquadro-gate { max-width: 380px; margin: 40px auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px; text-align: center; }
  .riquadro-gate h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0 0 8px; }
  .riquadro-gate p { color: var(--ink-muted); font-size: .9rem; margin: 0 0 20px; }
  .riquadro-gate form { display: flex; flex-direction: column; gap: 10px; }
  input[type="password"], input[type="number"], input[type="text"] {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-family: var(--font-body); font-size: .95rem; color: var(--ink); }
  .bottone { background: var(--ink); color: var(--surface); border: none; border-radius: 8px; padding: 10px 14px;
    font-family: var(--font-body); font-size: .88rem; font-weight: 600; cursor: pointer; }
  .bottone.secondario { background: var(--surface-2); color: var(--ink); }
  .bottone:hover { opacity: .9; }
  .messaggio { font-size: .85rem; margin: 8px 0 0; }
  .messaggio.errore { color: var(--danger); }
  .messaggio.ok { color: var(--ok); }

  .sezione { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px 22px 18px; margin-bottom: 18px; }
  .sezione h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0 0 12px; }
  .sezione h3 { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--primary); margin: 18px 0 8px; }
  .nota { color: var(--ink-muted); font-size: .82rem; margin: 6px 0 0; }
  .griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 18px; }
  .voce .etichetta { font-size: .74rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; }
  .voce .valore { font-size: .95rem; font-weight: 500; }
  .citazione { font-size: .82rem; color: var(--ink-muted); border-left: 3px solid var(--border); padding: 2px 0 2px 10px; margin: 4px 0 8px; }
  .pagina { font-family: var(--font-mono); font-size: .75rem; color: var(--primary); background: var(--primary-soft); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .elenco { margin: 4px 0; padding-left: 18px; }
  .elenco li { margin: 3px 0; font-size: .9rem; }

  .etichetta-stato { display: inline-block; font-size: .78rem; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
  .stato-PULITA { background: var(--ok-soft); color: var(--ok); }
  .stato-GESTIBILE { background: var(--primary-soft); color: var(--primary); }
  .stato-COMPLESSA { background: var(--secondary-soft); color: var(--secondary); }
  .stato-DA_SCARTARE { background: var(--danger-soft); color: var(--danger); }
  .verdetto { font-size: 1.02rem; font-weight: 600; margin: 8px 0 4px; }
  .numero-grande { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; }

  .tabella-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: .74rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  tr.totale td { font-weight: 700; }

  .riga-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 8px; }
  .campo { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--ink-muted); }
  .campo input[type="number"] { width: 150px; }
  .campo select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-family: var(--font-body); font-size: .95rem; color: var(--ink); max-width: 100%; }
  .etichetta-checkbox { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--ink); }

  .pulsanti-ai { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; margin-top: 10px; }
  .pulsante-ai { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    text-align: left; cursor: pointer; font-family: var(--font-body); font-size: .88rem; font-weight: 600; color: var(--ink); }
  .pulsante-ai small { display: block; font-weight: 400; color: var(--ink-muted); font-size: .74rem; }
  .pulsante-ai:hover { border-color: var(--primary); }
  textarea { width: 100%; min-height: 160px; font-family: var(--font-mono); font-size: .78rem; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; background: var(--bg); color: var(--ink); }
  /* Riepilogo in cima e indice delle sezioni (fase 4, 29/09/2026) */
  .riepilogo .verdetto { margin-top: 0; }
  .riepilogo .griglia { margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .riepilogo .numero-grande { font-size: 1.25rem; }
  .negativo { color: var(--danger); }
  .indice-pagina { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 10px; margin-bottom: 10px;
    background: var(--bg); }
  .indice-pagina button { font: inherit; font-size: .78rem; font-weight: 500; color: var(--ink-muted); background: var(--surface-2);
    border: none; border-radius: 999px; padding: 6px 12px; min-height: 32px; cursor: pointer; white-space: nowrap; }
  .indice-pagina button:hover { color: var(--ink); }
  .indice-pagina button.attiva { background: var(--ink); color: var(--surface); }
  .sezione-pagina { scroll-margin-top: 60px; }
  @media (max-width: 640px) {
    .indice-pagina { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px 10px; padding: 8px 14px 10px; }
    .indice-pagina::-webkit-scrollbar { display: none; }
    .indice-pagina button { flex-shrink: 0; }
  }
  @media print { .indice-pagina { display: none !important; } }
  @media (max-width: 560px) { .contenitore { padding: 24px 14px 72px; } h1 { font-size: 1.45rem; } }
  /* Comparabili (30/09/2026): una scheda per comparabile, campi su griglia */
  .comparabili { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .comparabile { display: grid; grid-template-columns: minmax(0, 3fr) repeat(4, minmax(0, 1fr)) auto auto; gap: 8px; align-items: end;
    background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .comparabile label { display: flex; flex-direction: column; gap: 3px; font-size: .72rem; color: var(--ink-muted); min-width: 0; }
  .comparabile input, .comparabile select { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 9px; font-family: var(--font-body); font-size: .86rem; color: var(--ink); }
  .comparabile .euro-mq { font-family: var(--font-mono); font-size: .86rem; white-space: nowrap; padding-bottom: 8px; }
  .comparabile .togli { background: none; border: none; color: var(--ink-muted); cursor: pointer; font-size: 1rem; padding: 6px; }
  .forchetta-comparabili { margin-top: 10px; }
  @media (max-width: 720px) {
    .comparabile { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .comparabile .campo-link { grid-column: 1 / -1; }
  }

  /* Niente zoom automatico di iPhone toccando un campo (campi a 16 px sul telefono) */
  @media (max-width: 640px) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea {
      font-size: 16px !important;   /* !important: vince anche sulle regole più specifiche (es. dettagli della visita a 14,4 px) */
    }
  }
</style>

  <p id="stato-verifica-automatica" class="nota">Verifica dell'accesso…</p>

<script>
  const SUPABASE_URL = "https://igemwrrcmsgaotoqvdzt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnZW13cnJjbXNnYW90b3F2ZHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDc2MjksImV4cCI6MjEwNDg4MzYyOX0.YkUOBTOb40C-N0TkuDN0o5N7fVvI_qX2F1grUp-SVe8";
  const ID_ASTA = new URLSearchParams(location.search).get("id") || "";
  // index.html apre il dettaglio della card con l'id nel frammento (apriDaLinkDiretto).
  if (ID_ASTA) document.getElementById("link-dettaglio").href = "index.html#" + encodeURIComponent(ID_ASTA);

  // Stessa chiave di config.html e statistiche.html.
  const CHIAVE_PASSWORD = "aste_password_v2";
  const CHIAVE_PARAMETRI = "superanalisi_parametri_v1";
  // Utile predefinito: 15% netto sul capitale investito nello scenario
  // centrale; almeno 5% netto anche nel prudenziale.
  const PARAMETRI_PREDEFINITI = { utilePct: 15, minimoPrudenzialePct: 5, primaCasa: false };
  // Il tuo valore di rivendita diventa lo scenario centrale; prudenziale e
  // ottimistico ne sono una forchetta (STIMA, da tarare).
  const FORCHETTA_VALORE_UTENTE = { prudenziale: 0.93, centrale: 1.0, ottimistico: 1.05 };

  let passwordCorrente = null;
  let RIGA = null;
  // Regime fiscale, aliquote e sconto di trattativa (Configurazione → Conti),
  // letti con leggi_parametri_conti; predefiniti finché non arrivano.
  let PARAMETRI_CONTI = window.Operazioni ? Operazioni.parametriConti(null)
    : { regimeFiscale: "privato", aliquotaImpresa: 0.279, registroImpresa: 0.09, scontoTrattativaComparabili: 0.05 };
  let ESITO_CONTO = null;         // ultimo conto di disegnaConto, per il prompt
  let promptModificato = false;   // true se hai scritto nel riquadro del prompt

  // ============================================================ utilità
  // Link dal database: solo http(s), niente "javascript:" dentro un href.
  function urlSicuro(u) { const t = String(u || "").trim(); return /^https?:\/\//i.test(t) ? t : "#"; }
  // Anche le virgolette: il testo finisce pure dentro attributi (href, title).
  function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t === null || t === undefined ? "" : String(t); return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  const vuoto = (v) => v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length);
  // punto delle migliaia sempre, anche a 4 cifre ("€ 1.500", non "€ 1500")
  function eur(v) { const n = Number(v); return vuoto(v) || !Number.isFinite(n) ? "—" : "€ " + (Math.round(n) < 0 ? "-" : "") + String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
  function mq(v) { const n = Number(v); return vuoto(v) || !Number.isFinite(n) ? "—" : n.toLocaleString("it-IT") + " mq"; }
  function testo(v) { return vuoto(v) ? "—" : String(v).replace(/_/g, " "); }
  const frase = (t) => { const s = String(t).trim(); return /[.!?]$/.test(s) ? s : s + "."; };
  function sino(v) { return v === true || v === "true" || v === "si" ? "sì" : v === false || v === "false" || v === "no" ? "no" : testo(v); }
  const pag = (p) => vuoto(p) ? "" : `<span class="pagina">p. ${escapeHtml(p)}</span>`;
  const cit = (c) => vuoto(c) ? "" : `<div class="citazione">«${escapeHtml(c)}»</div>`;
  function voce(etichetta, valore, extra = "") {
    return `<div class="voce"><div class="etichetta">${escapeHtml(etichetta)}</div><div class="valore">${escapeHtml(valore)}${extra}</div></div>`;
  }

  async function chiamaRpc(nome, payload) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    return r.json();
  }

  async function messaggioPasswordRifiutata() {
    try {
      const secondi = await chiamaRpc("blocco_password", { p_tipo: "scrittura" });
      if (typeof secondi === "number" && secondi > 0) return `Troppi tentativi errati: riprova tra ${Math.ceil(secondi / 60)} minuti.`;
    } catch (e) {}
    return "Password errata.";
  }

  function leggiLocale(chiave) { try { return localStorage.getItem(chiave); } catch (e) { return null; } }
  function scriviLocale(chiave, valore) { try { localStorage.setItem(chiave, valore); } catch (e) {} }
  function cancellaLocale(chiave) { try { localStorage.removeItem(chiave); } catch (e) {} }

  // ============================================================ accesso
  async function sblocca() {
    const password = document.getElementById("campo-password").value;
    const erroreEl = document.getElementById("errore-gate");
    erroreEl.classList.add("nascosto");
    if (!password) return;
    let ok;
    try { ok = await chiamaRpc("verifica_password", { password_tentativo: password }); }
    catch (e) { erroreEl.textContent = "Impossibile contattare Supabase."; erroreEl.classList.remove("nascosto"); return; }
    if (ok === true) { passwordCorrente = password; scriviLocale(CHIAVE_PASSWORD, password); mostraContenuto(); }
    else { erroreEl.textContent = await messaggioPasswordRifiutata(); erroreEl.classList.remove("nascosto"); }
  }

  async function provaSbloccoAutomatico() {
    const ricordata = leggiLocale(CHIAVE_PASSWORD);
    if (ricordata) {
      try {
        if (await chiamaRpc("verifica_password", { password_tentativo: ricordata }) === true) {
          passwordCorrente = ricordata; mostraContenuto(); return;
        }
        cancellaLocale(CHIAVE_PASSWORD);
      } catch (e) {}
    }
    document.getElementById("stato-verifica-automatica").classList.add("nascosto");
    document.getElementById("schermata-password").classList.remove("nascosto");
    document.getElementById("campo-password").focus();
  }

  function mostraContenuto() {
    document.getElementById("stato-verifica-automatica").classList.add("nascosto");
    document.getElementById("schermata-password").classList.add("nascosto");
    document.getElementById("schermata-contenuto").classList.remove("nascosto");
    caricaAsta();
  }

  // ============================================================ dati
  async function caricaAsta() {
    const msg = document.getElementById("messaggio-caricamento");
    if (!/^\d+$/.test(ID_ASTA)) { msg.textContent = "Manca l'asta: apri questa pagina dal pulsante \"Superanalisi\" del registro."; return; }
    try {
      // Lettura protetta dalla password (leggi_aste, sql/lettura_protetta.sql nel repo privato).
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/leggi_aste?select=*&id_annuncio=eq.${ID_ASTA}`,
        { method: "POST", headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ password_tentativo: passwordCorrente, tipo: "scrittura" }) });
      const righe = await r.json();
      if (!Array.isArray(righe) || !righe.length) { msg.textContent = `Asta ${ID_ASTA} non trovata nel registro.`; return; }
      RIGA = righe[0];
      try {
        const pc = await chiamaRpc("leggi_parametri_conti", { password_tentativo: passwordCorrente, tipo: "scrittura" });
        if (pc && pc.ok && window.Operazioni) PARAMETRI_CONTI = Operazioni.parametriConti(pc.parametri);
      } catch (e) { /* predefiniti */ }
      msg.classList.add("nascosto");
      disegna();
    } catch (e) {
      msg.textContent = `Non riesco a leggere il registro: ${e.message}`;
    }
  }

  function analisiV2(riga) {
    const a = riga && riga.analisi_v2;
    return a && typeof a === "object" && String(riga.versione_prompt || "").startsWith("v2") ? a : null;
  }

  // ============================================================ pagina
  function disegna() {
    const r = RIGA;
    const a = analisiV2(r);
    document.title = `Superanalisi · ${r.comune__indirizzo || ID_ASTA}`;
    document.getElementById("titolo").textContent = r.comune__indirizzo || `Asta ${ID_ASTA}`;
    document.getElementById("sottotitolo").textContent =
      [Etichette.tribunale(r.tribunale), r.n__lotto ? Etichette.lotto(r.n__lotto) : "", r.tipologia ? Etichette.tipologia(r.tipologia) : ""]
        .filter(Boolean).join(" · ");
    const html = [`<div id="sa-riepilogo" class="sezione-pagina">${sezioneRiepilogo(r, null)}</div>`,
      `<div id="sa-annuncio" class="sezione-pagina">${sezioneAnnuncio(r, a)}</div>`];
    if (!a) {
      html.push(`<div class="sezione"><h2>Analisi v2 non ancora disponibile</h2>
        <p class="nota">Questa asta è stata analizzata con il prompt precedente (v1), che non estrae i dettagli con pagina e
        citazione. Per averla serve una rianalisi con la v2 (il ricontrollo automatico riguarda solo le aste senza perizia) o un nuovo
        ricontrollo. Nel frattempo puoi usare la seconda opinione qui sotto.</p></div>`);

      html.push(`<div id="sa-perizia" class="sezione-pagina">${sezionePerizia(a)}</div>`);
      html.push(`<div id="blocco-valore-rivendita" class="sezione-pagina">${sezioneValoreRivendita(r, a)}</div>`);
      html.push(`<div id="blocco-comparabili" class="sezione-pagina">${sezioneComparabili(r)}</div>`);
      html.push(`<div id="sezione-conto" class="sezione-pagina"></div>`);
    }
    html.push(`<div id="sa-seconda" class="sezione-pagina">${sezioneSecondaOpinione(r, a)}</div>`);
    document.getElementById("contenuto").innerHTML = html.join("");
    if (a) { disegnaConto(); mostraComparabili(); }
    montaRisultatiEsterni();
    disegnaIndicePagina();
  }

  // ============================================================ riepilogo e indice
  // Il verdetto calcolato comincia con la classe ("PULITA — offerta massima…"),
  // che la pagina mostra già nell'etichetta colorata accanto: qui la si toglie
  // per non leggerla due volte. Il testo intero resta nel prompt per le AI.
  function verdettoSenzaClasse(esito) {
    const v = String((esito && esito.verdetto) || "");
    for (const inizio of [`${esito.classe} — `, esito.classe === "DA_SCARTARE" ? "SCARTARE — " : null]) {
      if (inizio && v.startsWith(inizio)) return v.slice(inizio.length);
    }
    return v;
  }
  // Margine sull'offerta minima: se negativo l'obiettivo di utile non si
  // raggiunge nemmeno all'offerta minima (stesso numero, detto in chiaro).
  function testoMargine(h) {
    if (h == null) return { etichetta: "Margine sull'offerta minima", valore: "—", classe: "" };
    if (h < 0) return { etichetta: "Obiettivo non raggiungibile all'offerta minima", valore: `mancano ${eur(-h)}`, classe: "negativo" };
    return { etichetta: "Margine sull'offerta minima", valore: eur(h), classe: "" };
  }

  // In cima: le cifre per decidere, prese dal conto (se c'è l'analisi v2).
  function sezioneRiepilogo(r, esito) {
    const dataVendita = r.data_vendita ? new Date(r.data_vendita).toLocaleDateString("it-IT") : "—";
    if (!esito) {
      return `<div class="sezione riepilogo"><h2>Riepilogo</h2>
        ${analisiV2(r) ? "" : `<p class="nota">Giudizio e offerta massima non disponibili: serve l'analisi v2 della perizia.</p>`}
        <div class="griglia">
          <div class="voce"><div class="etichetta">Offerta minima</div><div class="numero-grande">${eur(r.offerta_minima)}</div></div>
          <div class="voce"><div class="etichetta">Data vendita</div><div class="numero-grande">${escapeHtml(dataVendita)}</div></div>
        </div></div>`;
    }
    const m = testoMargine(esito.headroom);
    return `<div class="sezione riepilogo"><h2>Riepilogo</h2>
      <p class="verdetto"><span class="etichetta-stato stato-${escapeHtml(esito.classe)}">${escapeHtml(testo(esito.classe))}</span> ${escapeHtml(verdettoSenzaClasse(esito))}</p>
      <div class="griglia">
        <div class="voce"><div class="etichetta">Offerta minima</div><div class="numero-grande">${eur(r.offerta_minima)}</div></div>
        <div class="voce"><div class="etichetta">Offerta massima</div><div class="numero-grande">${eur(esito.offertaMassima)}</div></div>
        <div class="voce"><div class="etichetta">${escapeHtml(m.etichetta)}</div><div class="numero-grande ${m.classe}">${escapeHtml(m.valore)}</div></div>
        <div class="voce"><div class="etichetta">Qualità dei dati</div><div class="numero-grande">${escapeHtml(esito.qualita.livello)}</div></div>
        <div class="voce"><div class="etichetta">Data vendita</div><div class="numero-grande">${escapeHtml(dataVendita)}</div></div>
      </div>
      <p class="nota"><a href="#sezione-conto" onclick="event.preventDefault(); vaiASezionePagina('sezione-conto')">Vedi il conto completo ↓</a></p>
    </div>`;
  }

  const VOCI_INDICE = [["sa-riepilogo", "Riepilogo"], ["sa-annuncio", "Annuncio"], ["sa-perizia", "Perizia"],
    ["blocco-valore-rivendita", "Rivendita"], ["blocco-comparabili", "Comparabili"], ["sezione-conto", "Conto"], ["sa-seconda", "Seconda opinione"],
    ["sezione-risultati-esterni", "Risultati salvati"]];
  function disegnaIndicePagina() {
    const nav = document.getElementById("indice-pagina");
    const voci = VOCI_INDICE.filter(([id]) => { const el = document.getElementById(id); return el && !el.classList.contains("nascosto"); });
    nav.innerHTML = voci.map(([id, t]) => `<button type="button" data-sez="${id}" onclick="vaiASezionePagina('${id}')">${t}</button>`).join("");
    nav.classList.toggle("nascosto", voci.length < 2);
    aggiornaVoceIndicePagina();
  }
  let bloccoIndicePaginaFinoA = 0;
  function vaiASezionePagina(id) {
    const el = document.getElementById(id);
    if (!el) return;
    bloccoIndicePaginaFinoA = Date.now() + 900;
    evidenziaVoceIndicePagina(id);
    const alto = window.scrollY + el.getBoundingClientRect().top - document.getElementById("indice-pagina").offsetHeight - 8;
    window.scrollTo({ top: Math.max(0, alto), behavior: "smooth" });
  }
  function evidenziaVoceIndicePagina(id) {
    const nav = document.getElementById("indice-pagina");
    let attiva = null;
    nav.querySelectorAll("button[data-sez]").forEach((b) => { b.classList.toggle("attiva", b.dataset.sez === id); if (b.dataset.sez === id) attiva = b; });
    if (attiva && nav.scrollWidth > nav.clientWidth) {
      const sx = attiva.offsetLeft - nav.offsetLeft, dx = sx + attiva.offsetWidth;
      if (sx < nav.scrollLeft) nav.scrollLeft = sx - 8;
      else if (dx > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = dx - nav.clientWidth + 8;
    }
  }
  // Voce evidenziata = sezione che si sta guardando (in fondo alla pagina l'ultima visibile).
  function aggiornaVoceIndicePagina() {
    const nav = document.getElementById("indice-pagina");
    if (!nav || nav.classList.contains("nascosto")) return;
    if (Date.now() < bloccoIndicePaginaFinoA) { bloccoIndicePaginaFinoA = Math.max(bloccoIndicePaginaFinoA, Date.now() + 150); return; }
    const sezioni = [...nav.querySelectorAll("button[data-sez]")].map((b) => document.getElementById(b.dataset.sez)).filter(Boolean);
    if (!sezioni.length) return;
    const linea = nav.getBoundingClientRect().bottom + 24;
    const inFondo = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
    let id = null;
    sezioni.forEach((s) => { if (inFondo ? s.getBoundingClientRect().top < window.innerHeight - 40 : s.getBoundingClientRect().top <= linea) id = s.id; });
    evidenziaVoceIndicePagina(id || sezioni[0].id);
  }
  window.addEventListener("scroll", aggiornaVoceIndicePagina, { passive: true });

  // Sezione "Salva il risultato dell'AI" (superanalisi-esterne.js): montata

  function montaRisultatiEsterni() {
    const el = document.getElementById("sezione-risultati-esterni");
    if (el.dataset.montata) return;
    el.dataset.montata = "1";
    el.classList.remove("nascosto");
    SuperanalisiEsterne.montaSalvataggio({
      contenitore: el, tipo: "asta", idAnnunci: () => [ID_ASTA], idAstaElenco: ID_ASTA,
      chiamaRpc, password: () => passwordCorrente,
    });
  }

  function sezioneAnnuncio(r, a) {

  function sezionePerizia(a) {

    const U = a.urbanistica || {}, CP = U.condono_pendente || {}, O = a.occupazione || {}, C = a.condominio || {};

    const disc = (a.discordanze || []).filter((x) => x && typeof x === "object");
    const rischi = (a.altri_rischi || []).filter((x) => x && typeof x === "object");

    return `<div class="sezione"><h2>Perizia</h2>

      </div>
      ${vuoto(P.problemi_lettura) ? "" : `<p class="nota">⚠️ ${escapeHtml(P.problemi_lettura)}</p>`}

      <h3>Superfici</h3>

        ${voce("Catastale totale", mq(S.catastale_totale_mq))}
        ${voce("Balconi / terrazzi", mq(S.balconi_terrazzi_mq))}
        ${voce("Giardino / corte", mq(S.giardino_corte_mq))}

      ${vuoto(S.note) ? "" : `<p class="nota">${escapeHtml(S.note)}</p>`}

      <h3>Catasto</h3>
      ${unita.length ? `<div class="tabella-scroll"><table><thead><tr><th>Ruolo</th><th>Foglio / part. / sub</th><th>Categoria</th><th>Consistenza</th><th>Rendita</th></tr></thead><tbody>
        ${unita.map((u) => `<tr><td>${escapeHtml(testo(u.ruolo))}</td><td>${escapeHtml([u.foglio, u.particella, u.subalterno].map(testo).join(" / "))}</td>
          <td>${escapeHtml(testo(u.categoria))}</td><td>${escapeHtml(testo(u.consistenza))}</td><td>${eur(u.rendita_euro)} ${pag(u.pagina)}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="nota">Nessuna unità catastale indicata.</p>`}
      <p class="nota">Conformità catastale: <strong>${escapeHtml(testo(CAT.conformita_catastale))}</strong>
        ${vuoto(CAT.descrizione_difformita_catastale) ? "" : ` — ${escapeHtml(CAT.descrizione_difformita_catastale)}`}</p>

      <h3>Urbanistica</h3>
      <div class="griglia">
        ${voce("Conformità urbanistica", testo(U.conformita_urbanistica))}
        ${voce("Agibilità", testo(U.agibilita), U.data_agibilita ? ` (${escapeHtml(Etichette.data(U.data_agibilita))})` : "")}
        ${voce("Costo totale regolarizzazione (CTU)", eur(U.costo_totale_regolarizzazione_ctu_euro))}
        ${voce("Condono pendente", sino(CP.presente), CP.presente === true || CP.presente === "true"
          ? ` ${escapeHtml([CP.legge, CP.anno_domanda, CP.stato].filter((x) => !vuoto(x)).join(", "))} ${pag(CP.pagina)}` : "")}
      </div>
      ${diff.length ? `<ul class="elenco">${diff.map((x) => `<li><strong>${escapeHtml(testo(x.tipo))}</strong>: ${escapeHtml(testo(x.descrizione))}
        ${vuoto(x.costo_ctu_euro) ? "" : ` — ${eur(x.costo_ctu_euro)}`} ${pag(x.pagina)}${cit(x.citazione)}</li>`).join("")}</ul>`
        : `<p class="nota">Nessuna difformità indicata.</p>`}

      <h3>Occupazione</h3>
      <p><strong>${escapeHtml(testo(O.stato))}</strong>${O.data_rilevazione ? ` (rilevata ${escapeHtml(Etichette.data(O.data_rilevazione))})` : ""} ${pag(O.pagina)}</p>

  // ============================================================ comparabili
  // Annunci o vendite simili (sql/comparabili_e_conti.sql nel repo privato):
  // €/mq di ciascuno, forchetta 25°/50°/75° percentile (underwriting.js,
  // forchettaComparabili) × superficie commerciale dell'asta. Con "usa" sono
  // la prima fonte del valore di rivendita, anche per il registro e la
  // Superanalisi di gruppo.
  // Etichette corte: stanno nei campi anche su PC. "Ristrutturato" vale anche per il nuovo.
  const STATI_COMPARABILE = [["ristrutturato", "Ristrutturato"], ["buono", "Buono"], ["da_ristrutturare", "Da ristrutturare"]];
  const TIPI_COMPARABILE = [["annuncio", "Annuncio"], ["venduto", "Venduto"]];
  let COMPARABILI_BOZZA = null;   // righe in modifica (non ancora salvate)

  function comparabiliSalvati(r) {
    const c = r && r.comparabili_utente;
    return c && Array.isArray(c.righe) ? c : { righe: [], usa: false };
  }
  // €/mq dai comparabili salvati con "usa", per il conto (null se non si usano).
  function arvEuroMqComparabili(r) {
    const c = comparabiliSalvati(r);
    if (!c.usa || !window.Underwriting) return null;
    return Underwriting.forchettaComparabili(c.righe, { scontoTrattativaComparabili: PARAMETRI_CONTI.scontoTrattativaComparabili });
  }

  function rigaComparabile(x, i) {
    const opzioni = (lista, scelto) => lista.map(([v, t]) => `<option value="${v}"${v === scelto ? " selected" : ""}>${t}</option>`).join("");
    return `<div class="comparabile" data-i="${i}">

      <label>Prezzo (€)<input type="number" data-campo="prezzo" min="0" step="1000" inputmode="numeric" value="${x.prezzo ?? ""}" oninput="aggiornaComparabili()"></label>

  }

  function sezioneComparabili(r) {
    const c = comparabiliSalvati(r);
    COMPARABILI_BOZZA = c.righe.map((x) => ({ ...x }));
    return `<div class="sezione"><h2>Comparabili</h2>
      <p class="nota">Annunci o vendite di immobili simili nella stessa zona: link, mq, prezzo, stato ("Ristrutturato" vale anche per il nuovo) e tipo ("Annuncio" = prezzo richiesto, "Venduto" = prezzo vero). Per ognuno si calcola il prezzo al metro
        (sugli annunci meno ${Math.round(PARAMETRI_CONTI.scontoTrattativaComparabili * 100)}% di trattativa, da Configurazione → Conti); la forchetta è il 25°
        percentile, la mediana e il 75° percentile, per la superficie commerciale dell'asta. Contano soprattutto gli immobili ristrutturati: se sono
        almeno 3 si usano solo loro. Servono almeno 3 comparabili.</p>
      <div class="comparabili" id="elenco-comparabili"></div>

  }

  function mostraComparabili() {
    const el = document.getElementById("elenco-comparabili");
    if (!el) return;
    el.innerHTML = COMPARABILI_BOZZA.length ? COMPARABILI_BOZZA.map(rigaComparabile).join("")
      : `<p class="nota">Nessun comparabile: aggiungine uno o importali dai link dell'asta.</p>`;
    aggiornaComparabili();
  }

  function leggiComparabiliDalModulo() {
    document.querySelectorAll("#elenco-comparabili .comparabile").forEach((riga) => {
      const x = COMPARABILI_BOZZA[Number(riga.dataset.i)];
      if (!x) return;
      riga.querySelectorAll("[data-campo]").forEach((campo) => {
        const k = campo.dataset.campo;
        x[k] = k === "mq" || k === "prezzo" ? (campo.value === "" ? null : Number(campo.value)) : campo.value.trim();
      });
    });
  }

  // €/mq di ogni riga e forchetta, mentre scrivi (niente salvataggio).
  function aggiornaComparabili() {
    leggiComparabiliDalModulo();
    const sconto = PARAMETRI_CONTI.scontoTrattativaComparabili;
    document.querySelectorAll("#elenco-comparabili .comparabile").forEach((riga) => {
      const x = COMPARABILI_BOZZA[Number(riga.dataset.i)] || {};
      const v = x.mq > 0 && x.prezzo > 0 ? x.prezzo * (x.tipo === "annuncio" ? 1 - sconto : 1) / x.mq : null;
      riga.querySelector("[data-euro-mq]").textContent = v ? `${eur(v)}/mq` : "—";
    });
    const out = document.getElementById("forchetta-comparabili");
    if (!out || !window.Underwriting) return;
    const f = Underwriting.forchettaComparabili(COMPARABILI_BOZZA, { scontoTrattativaComparabili: sconto });
    if (!f) { out.innerHTML = ""; return; }
    const sup = ESITO_CONTO && ESITO_CONTO.superficie ? ESITO_CONTO.superficie.mq : null;
    const valore = (k) => sup ? ` → ${eur(f[k] * sup)}` : "";
    out.innerHTML = `<div class="griglia">
        <div class="voce"><div class="etichetta">Prudenziale (25°)</div><div class="valore">${eur(f.prudenziale)}/mq${valore("prudenziale")}</div></div>
        <div class="voce"><div class="etichetta">Centrale (mediana)</div><div class="valore">${eur(f.centrale)}/mq${valore("centrale")}</div></div>
        <div class="voce"><div class="etichetta">Ottimistico (75°)</div><div class="valore">${eur(f.ottimistico)}/mq${valore("ottimistico")}</div></div>
      </div>
      <p class="nota">Usati ${f.n} comparabili su ${f.totali}${sup ? `, superficie commerciale ${mq(sup)}` : ""}.${f.avvisi.length ? ` ⚠️ ${escapeHtml(f.avvisi.join("; "))}.` : ""}</p>`;
  }

  function aggiungiComparabile(x) {
    leggiComparabiliDalModulo();
    if (COMPARABILI_BOZZA.length >= 30) return;
    COMPARABILI_BOZZA.push(x || { url: "", mq: null, prezzo: null, stato: "ristrutturato", tipo: "annuncio" });
    mostraComparabili();
  }
  function togliComparabile(i) {
    leggiComparabiliDalModulo();
    COMPARABILI_BOZZA.splice(i, 1);
    mostraComparabili();
  }

  // I link salvati nei dettagli dell'asta (letti con i dati personali e la
  // password di lettura ricordata dal registro): una riga per link nuovo.
  async function importaLinkComparabili() {
    const msg = document.getElementById("messaggio-comparabili");
    msg.className = "messaggio";
    try {
      const passwordLettura = leggiLocale("aste_password_lettura_v1") || "";
      const d = await chiamaRpc("leggi_dati_personali", { password_tentativo: passwordLettura });
      if (!d || !d.ok) throw new Error("apri prima il registro su questo dispositivo (serve la password di lettura)");
      const riga = (d.link_utili || []).find((l) => String(l.id_annuncio) === String(ID_ASTA));
      const link = (riga && Array.isArray(riga.links) ? riga.links : []).map((l) => (typeof l === "string" ? l : l && l.url) || "")
        .filter((u) => /^https?:\/\//i.test(u));
      leggiComparabiliDalModulo();
      const nuovi = link.filter((u) => !COMPARABILI_BOZZA.some((x) => x.url === u));
      if (!nuovi.length) { msg.textContent = link.length ? "I link dell'asta sono già tra i comparabili." : "Nessun link salvato nei dettagli di quest'asta."; return; }
      nuovi.slice(0, 30 - COMPARABILI_BOZZA.length).forEach((u) => COMPARABILI_BOZZA.push({ url: u, mq: null, prezzo: null, stato: "ristrutturato", tipo: "annuncio" }));
      mostraComparabili();
      msg.textContent = `Importati ${nuovi.length} link: aggiungi mq, prezzo e stato, poi Salva.`;
    } catch (e) {
      msg.textContent = `Importazione non riuscita: ${e.message}`;
      msg.classList.add("errore");
    }
  }

  async function salvaComparabili(cancella = false) {
    const msg = document.getElementById("messaggio-comparabili");
    msg.className = "messaggio";
    leggiComparabiliDalModulo();
    const righe = COMPARABILI_BOZZA.filter((x) => x.url || x.mq || x.prezzo);
    if (cancella && !confirm("Cancellare tutti i comparabili di quest'asta?")) return;

    document.querySelectorAll(".pulsante-comparabili").forEach((b) => { b.disabled = true; });

    } catch (e) { msg.textContent = "Richiesta non riuscita. Controlla la connessione."; msg.classList.add("errore"); }

  // ============================================================ valore di rivendita
  // Precedenza: comparabili (se scegli di usarli) > il tuo valore > OMI (dati caricati nel registro, fase 2) >
  // quotazioni citate dal CTU > valore del CTU (dentro underwriting.js).
  function fonteRivendita(r, a) {
    const comparabili = arvEuroMqComparabili(r);
    if (comparabili) {
      return { tipo: "comparabili", etichetta: `comparabili (${comparabili.n}): ${eur(comparabili.prudenziale)}–${eur(comparabili.ottimistico)}/mq`,
        arvEuroMq: comparabili };
    }
    const utente = Number(r.valore_rivendita_utente);
    if (Number.isFinite(utente) && utente > 0) {
      const f = FORCHETTA_VALORE_UTENTE;
      return { tipo: "utente", etichetta: `il tuo valore (${eur(utente)})`,
        arvOverride: { prudenziale: Math.round(utente * f.prudenziale), centrale: Math.round(utente * f.centrale), ottimistico: Math.round(utente * f.ottimistico) } };
    }
    const omiMin = Number(r.omi_min_euro_mq), omiMax = Number(r.omi_max_euro_mq);
    if (omiMin > 0 && omiMax >= omiMin) {
      return { tipo: "omi", omi: { min: omiMin, max: omiMax },
        etichetta: `OMI ${r.omi_periodo || ""}, zona ${r.omi_zona || "?"}${r.omi_zona_descrizione ? ` (${r.omi_zona_descrizione})` : ""}, ` +
          `${String(r.omi_tipologia || "").toLowerCase()} in stato ${String(r.omi_stato || "").toLowerCase()}: ${omiMin}–${omiMax} €/mq` };
    }
    const quot = (((a || {}).valutazione_ctu || {}).quotazioni_citate || [])
      .filter((q) => q && Number(q.min_euro_mq) > 0 && Number(q.max_euro_mq) >= Number(q.min_euro_mq));
    const scelta = quot.find((q) => /omi/i.test(String(q.fonte || ""))) || quot[0];
    if (scelta) {
      return { tipo: "citata", etichetta: `quotazioni ${testo(scelta.fonte)}${scelta.periodo ? ` ${scelta.periodo}` : ""} citate dal CTU${scelta.pagina ? ` (p. ${scelta.pagina})` : ""}`,
        omi: { min: Number(scelta.min_euro_mq), max: Number(scelta.max_euro_mq) } };
    }
    return { tipo: "ctu", etichetta: "valore del CTU (affidabilità bassa)" };
  }

  function sezioneValoreRivendita(r, a) {
    const f = fonteRivendita(r, a);
    const utente = Number(r.valore_rivendita_utente);
    return `<div class="sezione"><h2>Valore di rivendita</h2>
      <p>Fonte usata: <strong>${escapeHtml(f.etichetta)}</strong></p>
      ${f.tipo === "omi" ? `<p class="nota">Fonte dei valori: Agenzia Entrate - OMI. La zona è trovata dalle coordinate dell'annuncio PVP,
        che a volte sono approssimative: se la descrizione non corrisponde all'indirizzo, controlla la zona su
        <a href="https://www1.agenziaentrate.gov.it/servizi/geopoi_omi/index.php" target="_blank" rel="noopener">GEOPOI</a>
        e, se serve, inserisci il tuo valore.</p>` : ""}
      <p class="nota">Ordine delle fonti: i <a href="#blocco-comparabili">comparabili</a> (se scegli di usarli), il tuo valore, poi OMI (Agenzia delle Entrate – OMI), poi le quotazioni citate dal CTU,
        infine il valore del CTU. Con il tuo valore, lo scenario prudenziale usa il ${Math.round(FORCHETTA_VALORE_UTENTE.prudenziale * 100)}%
        e l'ottimistico il ${Math.round(FORCHETTA_VALORE_UTENTE.ottimistico * 100)}%.</p>
      <div class="riga-form">
        <label class="campo">Il tuo valore di rivendita (€)
          <input type="number" id="campo-valore-utente" min="0" step="1000" value="${Number.isFinite(utente) && utente > 0 ? utente : ""}" placeholder="es. 120000">
        </label>
        <button class="bottone pulsante-valore-utente" onclick="salvaValoreUtente()">Salva</button>
        <button class="bottone secondario pulsante-valore-utente" onclick="salvaValoreUtente(true)">Cancella (torna al calcolato)</button>
      </div>
      <p id="messaggio-valore-utente" class="messaggio nascosto"></p>
    </div>`;
  }

  async function salvaValoreUtente(cancella = false) {
    const msg = document.getElementById("messaggio-valore-utente");
    const campo = document.getElementById("campo-valore-utente");
    const valore = cancella ? null : Number(campo.value);

      if (esito && esito.result === "success") {

        // Solo questa sezione e il conto (che aggiorna il prompt se non l'hai

        document.getElementById("blocco-valore-rivendita").innerHTML = sezioneValoreRivendita(RIGA, analisiV2(RIGA));
        disegnaConto();
        const nuovo = document.getElementById("messaggio-valore-utente");

        msg.classList.add("errore");
      }
    } catch (e) { msg.textContent = "Richiesta non riuscita. Controlla la connessione."; msg.classList.add("errore"); }
    finally { document.querySelectorAll(".pulsante-valore-utente").forEach((b) => { b.disabled = false; }); }
  }

  // ============================================================ lavori scelti da te
  // Dopo il sopralluogo: livello (nessuna…pesante) o importo tuo (preventivo,
  // vale più del livello). Salvati nel database (imposta_lavori_utente,
  // sql/lavori_utente.sql nel repo privato), come il valore di rivendita:
  // valgono anche per la Superanalisi di gruppo e per il registro.
  const NOMI_CLASSE_STATO = { A_pronto: "pronto da abitare", B_rinfrescare: "da rinfrescare", C_rimodernare: "da rimodernare",
    D_ristrutturare: "da ristrutturare", E_degrado: "degrado", non_valutabile: "non valutabile (testo e foto non bastano)" };
  const LIVELLO_DA_CLASSE_STATO = { A_pronto: "nessuna", B_rinfrescare: "leggera", C_rimodernare: "media", D_ristrutturare: "pesante", E_degrado: "pesante" };
  // Testo del motore reso leggibile: "tabella D_ristrutturare × 62.59 mq" → "livello pesante × 63 mq".
  // Usato nel riquadro Lavori, nel riepilogo del conto e nel testo per le AI esterne.
  function testoLavoriLeggibile(t) {
    return String(t || "—")
      .replace(/tabella (\w+)/, (m, c) => `livello ${LIVELLO_DA_CLASSE_STATO[c] || c}`)
      .replace(/(\d+(?:\.\d+)?) mq/, (m, n) => `${Math.round(Number(n))} mq`)
      .replace("stato non valutabile: usata la classe D (prudenziale)", "stato non valutabile: usato «pesante» per prudenza");
  }

  function bloccoLavoriUtente(r, a, esito) {
    const classe = a && a.stato_manutentivo ? a.stato_manutentivo.classe : null;
    const automatico = classe === "non_valutabile" ? "pesante, per prudenza" : (LIVELLO_DA_CLASSE_STATO[classe] || "dalla perizia");
    const livelloTu = r.livello_lavori_utente || "";
    const importoTu = r.importo_lavori_utente === null || r.importo_lavori_utente === undefined ? "" : r.importo_lavori_utente;
    const l = esito.lavori || {};
    const leggibile = testoLavoriLeggibile;
    const come = l.daUtente === "importo" ? "importo tuo (niente +20% nel prudenziale, restano gli imprevisti)"
      : l.daUtente === "livello" ? `${leggibile(l.fonte)} (la stima del perito non si usa)` : `${leggibile(l.fonte)}${l.nota ? "; " + leggibile(l.nota) : ""}`;
    const stimaPerito = a && a.lavori_ctu && Number(a.lavori_ctu.importo_euro) > 0 ? Number(a.lavori_ctu.importo_euro) : null;
    const opzioni = [["", `Automatico (dalla perizia: ${automatico})`], ["nessuna", "Nessuna (0 €/mq)"], ["leggera", "Leggera (150 €/mq)"],
      ["media", "Media (350 €/mq)"], ["pesante", "Pesante (600 €/mq)"]];
    return `<h3>Lavori</h3>
      <div class="riga-form">
        <label class="campo">Livello lavori (dopo il sopralluogo)
          <select id="lavori-livello">${opzioni.map(([v, t]) => `<option value="${v}"${v === livelloTu ? " selected" : ""}>${escapeHtml(t)}</option>`).join("")}</select></label>
        <label class="campo">Importo lavori tuo (€), es. preventivo
          <input type="number" id="lavori-importo" min="0" step="500" value="${escapeHtml(importoTu)}" placeholder="facoltativo"></label>
        <button class="bottone pulsante-lavori" onclick="salvaLavoriUtente()">Salva</button>
        ${livelloTu || importoTu !== "" ? `<button class="bottone secondario pulsante-lavori" onclick="salvaLavoriUtente(true)">Torna all'automatico</button>` : ""}
      </div>
      <p class="nota">Nel conto: <strong>${eur(l.importo)}</strong> — ${escapeHtml(come)}. Stato in perizia: ${escapeHtml(NOMI_CLASSE_STATO[classe] || "non indicato")}${stimaPerito ? `; stima lavori del perito ${eur(stimaPerito)}` : ""}.</p>
      <p id="messaggio-lavori" class="messaggio nascosto"></p>`;
  }

  async function salvaLavoriUtente(automatico = false) {
    const msg = document.getElementById("messaggio-lavori");
    const livello = automatico ? null : (document.getElementById("lavori-livello").value || null);
    const testoImporto = automatico ? "" : document.getElementById("lavori-importo").value.trim();

      } else {
        msg.textContent = (esito && esito.message) || "Salvataggio non riuscito.";
        msg.classList.add("errore");
      }
    } catch (e) { msg.textContent = "Richiesta non riuscita. Controlla la connessione."; msg.classList.add("errore"); }
    finally { document.querySelectorAll(".pulsante-lavori").forEach((b) => { b.disabled = false; }); }
  }

  // ============================================================ conto dell'operazione
  function leggiParametri() {
    try { return { ...PARAMETRI_PREDEFINITI, ...(JSON.parse(leggiLocale(CHIAVE_PARAMETRI) || "{}")) }; }
    catch (e) { return { ...PARAMETRI_PREDEFINITI }; }
  }

  function aggiornaParametri() {
    const p = {
      utilePct: Number(document.getElementById("p-utile").value),
      minimoPrudenzialePct: Number(document.getElementById("p-minimo").value),
      primaCasa: document.getElementById("p-prima-casa").checked,
    };
    if (!(p.utilePct >= 0) || !(p.minimoPrudenzialePct >= 0)) return;
    scriviLocale(CHIAVE_PARAMETRI, JSON.stringify(p));
    disegnaConto();
  }

  function disegnaConto() {
    const el = document.getElementById("sezione-conto");
    if (!el) return;
    if (!window.Underwriting) {
      el.innerHTML = `<div class="sezione"><h2>Conto dell'operazione</h2><p class="messaggio errore">Calcolo non disponibile: ricarica la pagina.</p></div>`;
      return;
    }
    const r = RIGA, a = analisiV2(r), p = leggiParametri(), f = fonteRivendita(r, a);
    const annuncio = {
      comune: r.comune__indirizzo, offertaMinima: Number(r.offerta_minima) || null, prezzoBase: Number(r.prezzo_base) || null,
      valoreStima: Number(r.valore_stima_perito) || null, occupazione: r["disponibilità_pvp"] || null,
      omi: f.omi || null, arvOverride: f.arvOverride || null, arvEuroMq: f.arvEuroMq || null,
      // le tue correzioni dai dettagli del registro (vuote = dati della perizia)
      renditaOverride: Number(r.rendita_catastale_utente) > 0 ? Number(r.rendita_catastale_utente) : null,
      arretratiOverride: r.oneri_condominiali_utente === null || r.oneri_condominiali_utente === undefined || r.oneri_condominiali_utente === ""
        ? null : Number(r.oneri_condominiali_utente),
      // lavori scelti da te dopo il sopralluogo (vuoti = dalla perizia)
      livelloLavori: r.livello_lavori_utente || null,
      lavoriOverride: r.importo_lavori_utente === null || r.importo_lavori_utente === undefined || r.importo_lavori_utente === ""
        ? null : Number(r.importo_lavori_utente),
    };
    const esito = Underwriting.analizzaAsta(a, annuncio, {
      utileTargetPct: p.utilePct / 100, utileMinimoPrudenzialePct: p.minimoPrudenzialePct / 100,
      targetNetto: true, primaCasa: !!p.primaCasa,
      regimeFiscale: PARAMETRI_CONTI.regimeFiscale, aliquotaImpresa: PARAMETRI_CONTI.aliquotaImpresa, registroImpresa: PARAMETRI_CONTI.registroImpresa,
    });
    const impresa = PARAMETRI_CONTI.regimeFiscale === "impresa";
    const testoImposta = impresa ? `imposte sull'utile (impresa, ${Math.round(PARAMETRI_CONTI.aliquotaImpresa * 1000) / 10}%)` : "imposta del 26% sulla plusvalenza (privato)";
    if (esito.arv && f.tipo === "citata") esito.arv.fonte = `${f.etichetta}: ${annuncio.omi.min}–${annuncio.omi.max} €/mq × ${esito.superficie.mq} mq`;
    if (esito.arv && f.tipo === "omi") esito.arv.fonte = `${f.etichetta} × ${esito.superficie.mq} mq (Agenzia Entrate - OMI)`;
    ESITO_CONTO = esito;
    aggiornaPrompt();
    const riepilogo = document.getElementById("sa-riepilogo");
    if (riepilogo) riepilogo.innerHTML = sezioneRiepilogo(r, esito);
    const margine = testoMargine(esito.headroom);

    const scenari = ["prudenziale", "centrale", "ottimistico"];
    const alMinimo = esito.scenariAlMinimo;
    const nomiVoci = { prezzo: "Prezzo (offerta minima)", imposte: "Imposte di acquisto", speseProcedura: "Spese di procedura",
      arretratiCondominiali: "Arretrati condominiali", regolarizzazione: "Regolarizzazione (+25%)", tecnico: "Tecnico e pratiche",
      lavori: "Lavori", imprevisti: "Imprevisti (10%)", holding: "Costi di detenzione", vendita: "Costi di vendita" };

    const tabella = alMinimo && alMinimo.centrale ? `<div class="tabella-scroll"><table>
      <thead><tr><th>Al prezzo dell'offerta minima</th>${scenari.map((s) => `<th>${s}</th>`).join("")}</tr></thead><tbody>
      <tr><td>Valore di rivendita</td>${scenari.map((s) => `<td>${eur(alMinimo[s].arv)}</td>`).join("")}</tr>
      ${Object.keys(nomiVoci).map((k) => `<tr><td>${nomiVoci[k]}</td>${scenari.map((s) => `<td>${eur(alMinimo[s].voci[k])}</td>`).join("")}</tr>`).join("")}
      <tr class="totale"><td>Costo totale</td>${scenari.map((s) => `<td>${eur(alMinimo[s].totale)}</td>`).join("")}</tr>
      <tr><td>Mesi stimati</td>${scenari.map((s) => `<td>${alMinimo[s].mesi}</td>`).join("")}</tr>
      <tr><td>Capitale investito</td>${scenari.map((s) => `<td>${eur(alMinimo[s].capitale)}</td>`).join("")}</tr>
      <tr><td>Utile lordo</td>${scenari.map((s) => `<td>${eur(alMinimo[s].utile)}</td>`).join("")}</tr>
      <tr><td>${impresa ? "Imposte sull'utile (impresa)" : "Imposta sulla plusvalenza (26%)"}</td>${scenari.map((s) => `<td>${eur(alMinimo[s].impostaPlusvalenzaStimata)}</td>`).join("")}</tr>
      <tr class="totale"><td>Utile netto stimato</td>${scenari.map((s) => `<td>${eur(alMinimo[s].utileNettoStimato)}</td>`).join("")}</tr>
      <tr><td>Rendimento netto sul capitale</td>${scenari.map((s) => { const c = alMinimo[s]; return `<td>${c.capitale ? Math.round(c.utileNettoStimato / c.capitale * 100) : "—"}%</td>`; }).join("")}</tr>
      </tbody></table></div>` : "";

    el.innerHTML = `<div class="sezione"><h2>Conto dell'operazione</h2>
      <div class="riga-form">
        <label class="campo">Utile netto richiesto (% del capitale, scenario centrale)
          <input type="number" id="p-utile" min="0" step="1" value="${p.utilePct}" onchange="aggiornaParametri()"></label>
        <label class="campo">Utile netto minimo nel prudenziale (%)
          <input type="number" id="p-minimo" min="0" step="1" value="${p.minimoPrudenzialePct}" onchange="aggiornaParametri()"></label>
        <label class="etichetta-checkbox"><input type="checkbox" id="p-prima-casa" ${p.primaCasa ? "checked" : ""}${impresa ? " disabled" : ""} onchange="aggiornaParametri()"> Acquisto come prima casa${impresa ? " (non vale per un'impresa)" : ""}</label>
      </div>
      <p class="nota">Regime fiscale: <strong>${impresa ? "impresa" : "privato"}</strong> (Configurazione → Conti)${impresa
        ? `: registro ${Math.round(PARAMETRI_CONTI.registroImpresa * 1000) / 10}% sul prezzo, imposte ${Math.round(PARAMETRI_CONTI.aliquotaImpresa * 1000) / 10}% sull'utile; IVA sulla rivendita non calcolata`
        : ": 26% sulla plusvalenza se rivendi entro 5 anni"}.</p>
      ${bloccoLavoriUtente(r, a, esito)}
      <p class="verdetto"><span class="etichetta-stato stato-${escapeHtml(esito.classe)}">${escapeHtml(testo(esito.classe))}</span> ${escapeHtml(verdettoSenzaClasse(esito))}</p>
      <div class="griglia" style="margin-top:10px">
        <div class="voce"><div class="etichetta">Offerta massima</div><div class="numero-grande">${eur(esito.offertaMassima)}</div></div>
        <div class="voce"><div class="etichetta">${escapeHtml(margine.etichetta)}</div><div class="numero-grande ${margine.classe}">${escapeHtml(margine.valore)}</div></div>
        <div class="voce"><div class="etichetta">Qualità dei dati</div><div class="numero-grande">${escapeHtml(esito.qualita.livello)}</div></div>
      </div>
      ${esito.arv ? `<p class="nota">Valore di rivendita: ${escapeHtml(esito.arv.fonte)} (affidabilità ${escapeHtml(esito.arv.affidabilita)}).
        Superficie: ${mq(esito.superficie.mq)} (${escapeHtml(esito.superficie.fonte)}). Lavori: ${eur(esito.lavori.importo)} (${escapeHtml(testoLavoriLeggibile(esito.lavori.fonte))}).</p>` : ""}
      ${esito.maxBid ? `<p class="nota">Offerta massima per scenario: ${scenari.map((s) => `${s} ${eur(esito.maxBid[s])}`).join(" · ")} — vincolo: ${escapeHtml(esito.vincoloOffertaMassima || "—")}.</p>` : ""}
      ${tabella}
      ${esito.motivi.length ? `<h3>Cosa pesa sulla classe</h3><ul class="elenco">${esito.motivi.map((m) => `<li>${escapeHtml(m)}</li>`).join("")}</ul>` : ""}
      ${esito.qualita.motivi.length ? `<h3>Qualità dei dati (${escapeHtml(esito.qualita.livello)})</h3><ul class="elenco">${esito.qualita.motivi.map((m) => `<li>${escapeHtml(m)}</li>`).join("")}</ul>` : ""}
      ${esito.avvisi.length ? `<h3>Avvisi</h3><ul class="elenco">${esito.avvisi.map((m) => `<li>${escapeHtml(m)}</li>`).join("")}</ul>` : ""}
      <p class="nota">Stime con parametri fissi del sistema, descritti nel manuale (imposte, spese, tempi, costi di vendita, ${testoImposta}): servono a confrontare le aste, non sostituiscono il parere di un tecnico o di un commercialista. Le imposte usano
        le stesse regole delle stime del registro, con tre prudenze in più: prezzo-valore solo se conviene, niente prezzo-valore senza
        rendita, tecnico sempre conteggiato.</p>
    </div>`;
  }

  // ============================================================ seconda opinione
  // ChatGPT, Claude e Perplexity accettano il prompt nell'indirizzo (?q=);
  // per le altre il prompt viene copiato negli appunti. Nessun sito accetta
  // un file allegato via link: la perizia si scarica e si trascina nella chat.
  const AI = [
    { nome: "ChatGPT", url: "https://chatgpt.com/", q: "https://chatgpt.com/?q=" },
    { nome: "Claude", url: "https://claude.ai/new", q: "https://claude.ai/new?q=" },
    { nome: "Perplexity", url: "https://www.perplexity.ai/", q: "https://www.perplexity.ai/search?q=" },
    { nome: "Gemini", url: "https://gemini.google.com/app" },
    { nome: "Mistral Le Chat", url: "https://chat.mistral.ai/chat" },
    { nome: "DeepSeek", url: "https://chat.deepseek.com/" },
    { nome: "Grok", url: "https://grok.com/" },
    { nome: "Copilot", url: "https://copilot.microsoft.com/" },
  ];
  const MAX_LUNGHEZZA_URL = 6000;

  // Prompt rivisto il 29/09/2026: stop se la perizia non è allegata, il
  // nostro conto (ESITO_CONTO, da disegnaConto), rischi tipici delle aste,
  // classi definite come in underwriting.js (classificaOperazione) e
  // risposta con titoli fissi, per confrontare i risultati salvati.
  function costruisciPrompt(r, a) {
    const n = (v) => vuoto(v) ? "non indicato" : v;
    const righe = [
      "Sei un consulente esperto di aste giudiziarie immobiliari italiane. Compro all'asta per ristrutturare e rivendere. Ti allego la perizia di stima (CTU): leggila per intero, comprese tabelle, allegati e fotografie.",
      "",
      "PRIMA DI TUTTO: se la perizia non è allegata o non riesci a leggerla (file mancante, scansione illeggibile), non fare nessuna analisi: scrivi solo \"Allega la perizia\" e fermati.",
      "",
      `ANNUNCIO PVP: ${n(r.comune__indirizzo)}; ${n(r.tribunale)}; lotto ${n(r.n__lotto)}; prezzo base ${eur(r.prezzo_base)}; offerta minima ${eur(r.offerta_minima)}; vendita il ${r.data_vendita ? new Date(r.data_vendita).toLocaleDateString("it-IT") : "non indicata"}.`,
    ];
    if (!vuoto(r.descrizione_lotto)) righe.push(`Descrizione: ${String(r.descrizione_lotto).slice(0, 400)}`);
    if (a) {
      const P = a.perizia || {}, I = a.identificazione || {}, S = a.superfici || {}, U = a.urbanistica || {}, O = a.occupazione || {};
      const V = a.valutazione_ctu || {}, C = a.condominio || {}, M = a.stato_manutentivo || {}, F = a.formalita || {};
      const diff = (U.difformita || []).filter((x) => x && typeof x === "object");
      righe.push("", "DATI ESTRATTI IN AUTOMATICO DALLA PERIZIA (da verificare):",
        `- Lotto/beni considerati: ${n(P.lotti_usati)}; quota in vendita: ${n(I.quota_in_vendita)}`,
        `- Valore di mercato CTU: ${eur(V.valore_mercato_euro)}; valore finale: ${eur(V.valore_finale_euro)}`,
        `- Superficie commerciale: ${mq(S.commerciale_ctu_mq)}`,
        `- Occupazione: ${n(O.stato)}${vuoto(O.estremi_contratto) ? "" : `; contratto: ${O.estremi_contratto}`}`,
        `- Conformità urbanistica: ${n(U.conformita_urbanistica)}; difformità: ${diff.length}${vuoto(U.costo_totale_regolarizzazione_ctu_euro) ? "" : ` (costo CTU ${eur(U.costo_totale_regolarizzazione_ctu_euro)})`}`,
        `- Condono pendente: ${sino((U.condono_pendente || {}).presente)}`,
        `- Arretrati condominiali: ${eur(C.arretrati_euro)}; stato manutentivo: ${n(M.classe)}`,
        `- Pesi non cancellabili: ${(F.non_cancellabili || []).length ? F.non_cancellabili.join("; ") : "nessuno indicato"}`);
    }
    const e = ESITO_CONTO;
    if (e) {
      const c = e.scenariAlMinimo && e.scenariAlMinimo.centrale;
      righe.push("", "IL NOSTRO CONTO (stime automatiche, da verificare):");
      if (e.arv) righe.push(`- Valore di rivendita dopo i lavori: prudenziale ${eur(e.arv.prudenziale)}, centrale ${eur(e.arv.centrale)}, ottimistico ${eur(e.arv.ottimistico)} (fonte: ${e.arv.fonte})`);
      righe.push(`- Superficie usata: ${mq(e.superficie && e.superficie.mq)}${e.superficie && e.superficie.fonte ? ` (${e.superficie.fonte})` : ""}; lavori: ${eur(e.lavori && e.lavori.importo)}${e.lavori && e.lavori.fonte ? ` (${testoLavoriLeggibile(e.lavori.fonte)})` : ""}; regolarizzazione: ${e.regolarizzazione && e.regolarizzazione.nonDeterminato ? "non determinata" : eur(e.regolarizzazione && e.regolarizzazione.conRicarico)}`);
      if (c) righe.push(`- All'offerta minima, scenario centrale: costo totale ${eur(c.totale)}, utile netto ${eur(c.utileNettoStimato)}${c.capitale ? ` (${Math.round(c.utileNettoStimato / c.capitale * 100)}% del capitale)` : ""}, ${c.mesi} mesi`);
      righe.push(`- Offerta massima per il nostro obiettivo di utile: ${eur(e.offertaMassima)}`);
      righe.push(`- Nostra classe: ${testo(e.classe)}${e.motivi && e.motivi.length ? ` (${e.motivi.slice(0, 4).join("; ")})` : ""}`);
      if (e.verdetto) righe.push(`- Nostro verdetto: ${e.verdetto}`);
    }
    righe.push("", "COMPITI",
      "1. Verifica ciascun dato estratto, con la pagina della perizia.",
      "2. Rischi per chi compra all'asta, in particolare:",
      "   - occupazione: chi occupa e con quale titolo; se un contratto ha data certa anteriore al pignoramento (opponibile); se l'ordine di liberazione è già emesso; tempi realistici;",
      "   - abusi e difformità: sanabili o no, costi e tempi; conformità catastale;",
      "   - pesi che restano dopo il decreto di trasferimento (usufrutto, diritto di abitazione, servitù, domande giudiziali, vincoli);",
      "   - quota in vendita e comproprietari;",
      "   - condominio: arretrati (l'acquirente risponde di quelli dell'anno in corso e del precedente), lavori straordinari deliberati;",
      "   - stato dell'immobile e degli impianti, agibilità, APE;",
      "   - differenze tra perizia e annuncio.",
      "3. Conto: dimmi se valore di rivendita, costo dei lavori e offerta massima sono realistici e quali valori useresti tu. Se puoi cercare sul web, indica 2-3 annunci di vendita attuali nella zona (stessa tipologia, superficie simile) con link ed €/mq; altrimenti scrivi \"ricerca non disponibile\". Non inventare annunci o link. Concludi con: \"Conviene all'offerta minima: sì / no; offerta massima che faresti: [€]\".",
      "4. Cosa verificare prima dell'offerta (documenti, sopralluogo, custode, ufficio tecnico del comune, amministratore di condominio).",
      "5. Giudizio, con queste definizioni:",
      "   - PULITA: libera o occupata dal debitore, conforme o con piccole regolarizzazioni, nessun peso che resta all'acquirente;",
      "   - GESTIBILE: problemi con costi e tempi prevedibili (liberazione a cura del custode, opere da ripristinare, regolarizzazione costosa ma definita, ristrutturazione completa, lavori condominiali deliberati);",
      "   - COMPLESSA: esito incerto (occupata da terzi, condono o sanatoria pendente, sanabilità o costo non determinati, difformità su parti comuni, quota parziale, degrado, perizia di oltre 7 anni);",
      "   - DA SCARTARE: abusi non sanabili, locazione opponibile, pesi che restano all'acquirente, documentazione insufficiente.",
      "6. Pagine lette: quante pagine ha la perizia, quali hai letto, quali parti erano illeggibili.",
      "",
      "FORMATO DELLA RISPOSTA",
      "- Prima riga, da sola: \"Giudizio: PULITA\" (oppure GESTIBILE, COMPLESSA, DA SCARTARE).",
      "- Poi le sezioni con questi titoli:",
      "  ## Dati verificati (tabella: Dato | Nostro valore | Valore in perizia | Pagina | Esito)",
      "  ## Rischi",
      "  ## Conto",
      "  ## Cosa verificare",
      "  ## Pagine lette",
      "- Italiano, sintetico. Non inventare: se un dato non è nella perizia scrivi \"non indicato\".");
    return righe.join("\n");
  }

  // Il prompt si rifà quando cambia il conto (parametri, valore di
  // rivendita), ma non se l'hai già modificato a mano nel riquadro.
  function aggiornaPrompt() {
    const t = document.getElementById("testo-prompt");
    if (t && !promptModificato) t.value = costruisciPrompt(RIGA, analisiV2(RIGA));
  }

  async function copiaNegliAppunti(testoDaCopiare) {
    try { await navigator.clipboard.writeText(testoDaCopiare); return true; }
    catch (e) {
      const t = document.getElementById("testo-prompt");
      if (t) { t.focus(); t.select(); try { return document.execCommand("copy"); } catch (e2) {} }
      return false;
    }
  }

  async function apriAI(indice) {
    const ai = AI[indice];
    const prompt = document.getElementById("testo-prompt").value;
    const copiato = await copiaNegliAppunti(prompt);
    const conQ = ai.q ? ai.q + encodeURIComponent(prompt) : null;
    const url = conQ && conQ.length <= MAX_LUNGHEZZA_URL ? conQ : ai.url;
    window.open(url, "_blank", "noopener");
    SuperanalisiEsterne.aiAperta(ai.nome);
    const msg = document.getElementById("messaggio-ai");
    msg.className = "messaggio ok";
    msg.textContent = `${ai.nome} aperto${url === conQ ? " con il prompt già scritto" : ""}${copiato ? "; prompt copiato negli appunti (incollalo se serve)" : ""}. Allega la perizia: scaricala con il pulsante qui sopra e trascinala nella chat.`;
  }

  // Condivisione del PDF dal telefono: la pagina non può scaricare da sé la
  // perizia (CORS dei siti PVP/astegiudiziarie), la scarica la Edge Function
  // perizia-pdf (copia in aste-immobiliari/supabase/functions/perizia-pdf).
  // Due tocchi: il menu di condivisione si apre solo subito dopo un tocco, e
  // scaricare il PDF nel frattempo ne farebbe scadere il permesso (iPhone).
  const URL_FUNZIONE_PERIZIA_PDF = `${SUPABASE_URL}/functions/v1/perizia-pdf`;
  let filePerizia = null;

  function condivisioneFileSupportata() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([""], "prova.pdf", { type: "application/pdf" })] })); }
    catch (e) { return false; }
  }

  async function condividiPerizia() {
    const pulsante = document.getElementById("pulsante-condividi");
    const avanzamento = document.getElementById("avanzamento-pdf");
    const msg = document.getElementById("messaggio-ai");
    const mostra = (classe, t) => { msg.className = "messaggio " + classe; msg.textContent = t; };
    const mb = (b) => (b / 1048576).toFixed(1).replace(".", ",");
    if (filePerizia) {
      const prompt = document.getElementById("testo-prompt").value;
      await copiaNegliAppunti(prompt);   // alcune app ricevono il file ma ignorano il testo
      try {
        await navigator.share({ files: [filePerizia], title: `Perizia asta ${ID_ASTA}`, text: prompt });
        mostra("ok", "Perizia condivisa. Il prompt è anche negli appunti, se l'app non l'ha ricevuto.");
      } catch (e) {
        if (e.name !== "AbortError") mostra("errore", `Condivisione non riuscita (${e.message}).`);
      }
      return;
    }
    pulsante.disabled = true;
    try {
      const r = await fetch(URL_FUNZIONE_PERIZIA_PDF, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ password_tentativo: passwordCorrente, id_annuncio: ID_ASTA }),
      });
      if (!r.ok) {
        let e = {};
        try { e = await r.json(); } catch (x) {}
        mostra("errore", e.errore === "password" ? await messaggioPasswordRifiutata() : (e.messaggio || `Errore ${r.status}.`));
        return;
      }
      const totale = Number(r.headers.get("X-Dimensione") || 0);
      const lettore = r.body.getReader();
      const pezzi = [];
      let letti = 0;
      for (;;) {
        const { done, value } = await lettore.read();
        if (done) break;
        pezzi.push(value);
        letti += value.length;
        avanzamento.textContent = `${mb(letti)}${totale ? " / " + mb(totale) : ""} MB`;
      }
      filePerizia = new File(pezzi, `perizia_${ID_ASTA}.pdf`, { type: "application/pdf" });
      pulsante.textContent = "📤 Condividi la perizia…";
      document.getElementById("pulsante-salva").classList.remove("nascosto");
      avanzamento.textContent = `${mb(letti)} MB pronti`;
      mostra("ok", "Perizia pronta: tocca «Condividi» e scegli l'app dell'AI.");
    } catch (e) {
      mostra("errore", `Download della perizia non riuscito (${e.message}).`);
    } finally {
      pulsante.disabled = false;
    }
  }

  // Per le app che, ricevendo PDF e testo insieme, tengono solo il testo
  // (Gemini): condivide il solo PDF; il prompt va negli appunti. Il download
  // con un link blob: non va bene, su telefono passava il link invece del file.
  async function condividiSoloPdf() {
    if (!filePerizia) return;
    await copiaNegliAppunti(document.getElementById("testo-prompt").value);
    const msg = document.getElementById("messaggio-ai");
    try {
      await navigator.share({ files: [filePerizia] });
      msg.className = "messaggio ok";
      msg.textContent = "PDF condiviso. Incolla il prompt nella chat: è negli appunti.";
    } catch (e) {
      if (e.name !== "AbortError") { msg.className = "messaggio errore"; msg.textContent = `Condivisione non riuscita (${e.message}).`; }
    }
  }

  function sezioneSecondaOpinione(r, a) {
    const prompt = costruisciPrompt(r, a);
    return `<div class="sezione"><h2>Seconda opinione</h2>
      <p class="nota">Apri un'AI alla volta: il prompt viene scritto o copiato per te; allega la perizia trascinando il PDF nella chat.
        Il risultato puoi salvarlo nella sezione «Salva il risultato dell'AI» qui sotto. I piani gratuiti hanno limiti sul numero e la dimensione dei file.</p>
      <p>${r.link_pdf ? `<a class="bottone secondario" style="text-decoration:none;display:inline-block" href="${escapeHtml(urlSicuro(r.link_pdf))}" target="_blank" rel="noopener" download>⬇ Scarica la perizia (PDF)</a>` : "Nessun PDF della perizia nel registro."}</p>
      ${r.link_pdf && condivisioneFileSupportata() ? `<p><button class="bottone" id="pulsante-condividi" onclick="condividiPerizia()">📱 Prepara la perizia da condividere</button>
        <button class="bottone secondario nascosto" id="pulsante-salva" onclick="condividiSoloPdf()">📎 Condividi solo il PDF</button>
        <span id="avanzamento-pdf" class="nota"></span></p>
      <p class="nota">Dal telefono: prepara la perizia, poi «Condividi» apre il menu del telefono con il PDF e il prompt; scegli l'app dell'AI.
        Gemini riceve solo il testo: usa «Condividi solo il PDF», scegli Gemini e incolla il prompt, che è già negli appunti.</p>` : ""}
      <div class="pulsanti-ai">${AI.map((ai, i) => `<button class="pulsante-ai" onclick="apriAI(${i})">${escapeHtml(ai.nome)}
        <small>${ai.q ? "prompt già scritto" : "prompt negli appunti"}</small></button>`).join("")}</div>
      <p id="messaggio-ai" class="messaggio nascosto"></p>
      <h3>Prompt</h3>
      <textarea id="testo-prompt" oninput="promptModificato = true">${escapeHtml(prompt)}</textarea>
    </div>`;
  }

  provaSbloccoAutomatico();
</script>
