# .github/workflows/applica-modifiche-config.yml — repository Aste-Dashboard
#
# Da lanciare UNA VOLTA (Actions → "Applica modifiche config.html" → Run workflow).
#   1. aggiunge a config.html la card "Ricerca della perizia" (se qualcosa non
#      corrisponde si ferma e non salva nulla);
#   2. prova la pagina in un browser simulato (verifica_config.js);
#   3. mostra nel log le righe cambiate, salva config.html e chiede a GitHub
#      Pages di ripubblicare il sito.
# Prima di lanciarlo esegui migrazione_ricontrollo.sql su Supabase.
# Dopo l'uso puoi cancellare questo file, applica_modifiche_config.py e verifica_config.js.

name: Applica modifiche config.html

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  applica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Applica le modifiche
        run: python applica_modifiche_config.py

      - name: Prova la pagina in un browser simulato
        run: |
          npm install --no-save --no-package-lock jsdom@24
          node verifica_config.js config.html

      - name: Righe cambiate
        run: git --no-pager diff config.html

      - name: Salva config.html nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add config.html
          git commit -m "config.html: card Ricerca della perizia"
          git push

      - name: Ripubblica il sito su GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" \
            && echo "Ripubblicazione richiesta." \
            || echo "Richiesta non accettata: se tra qualche minuto config.html non è aggiornata, vedi le istruzioni."
